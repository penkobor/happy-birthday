<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❤️ Happy Valentine's Day ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000; 
            overflow: hidden; 
            cursor: pointer;
            font-family: 'Georgia', serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .love-text {
            position: fixed;
            font-size: clamp(16px, 4vw, 24px);
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(255,200,220,0.6), 0 0 20px rgba(255,150,180,0.3);
            animation: floatUp 2.75s ease-out forwards;
            z-index: 10;
            user-select: none;
            white-space: nowrap;
            max-width: 90vw;
            text-align: center;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            40% { opacity: 0.9; transform: translateY(-35px) scale(1.1); }
            100% { opacity: 0; transform: translateY(-120px) scale(0.6); }
        }
        #valentine-text {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #ff6b8a;
            font-size: clamp(22px, 4vw, 42px);
            font-family: 'Georgia', serif;
            font-style: italic;
            text-shadow: 0 0 15px rgba(255,100,140,0.5), 0 0 40px rgba(255,50,100,0.2);
            z-index: 10;
            pointer-events: none;
            letter-spacing: 3px;
            text-align: center;
        }
        #tap-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff2244;
            font-size: clamp(18px, 4vw, 28px);
            font-family: 'Georgia', serif;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255,50,80,0.7), 0 0 30px rgba(255,30,60,0.4);
            z-index: 20;
            pointer-events: none;
            animation: hintPulse 1.5s ease-in-out infinite;
            letter-spacing: 2px;
        }
        @keyframes hintPulse {
            0%, 100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }
    </style>
</head>
<body>
    <div id="tap-hint">тапни меня 💗</div>
    <div id="valentine-text">Happy Valentine's Day ♡</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ========================
    // SCENE SETUP
    // ========================
    const scene = new THREE.Scene();
    const isMobile = window.innerWidth < 768;
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.5, isMobile ? 8 : 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    // ========================
    // LIGHTS
    // ========================
    const ambientLight = new THREE.AmbientLight(0x333333, 1);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0xff2255, 2, 50);
    pointLight1.position.set(5, 5, 5);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xff5588, 1.5, 50);
    pointLight2.position.set(-5, 3, 3);
    scene.add(pointLight2);

    const pointLight3 = new THREE.PointLight(0xff99aa, 1, 50);
    pointLight3.position.set(0, -3, 5);
    scene.add(pointLight3);

    // ========================
    // 3D HEART
    // ========================
    function createHeart() {
        const x = 0, y = 0;
        const heartShape = new THREE.Shape();
        heartShape.moveTo(x + 0.5, y + 0.5);
        heartShape.bezierCurveTo(x + 0.5, y + 0.5, x + 0.4, y, x, y);
        heartShape.bezierCurveTo(x - 0.6, y, x - 0.6, y + 0.7, x - 0.6, y + 0.7);
        heartShape.bezierCurveTo(x - 0.6, y + 1.1, x - 0.3, y + 1.54, x + 0.5, y + 1.9);
        heartShape.bezierCurveTo(x + 1.2, y + 1.54, x + 1.6, y + 1.1, x + 1.6, y + 0.7);
        heartShape.bezierCurveTo(x + 1.6, y + 0.7, x + 1.6, y, x + 1.0, y);
        heartShape.bezierCurveTo(x + 0.7, y, x + 0.5, y + 0.5, x + 0.5, y + 0.5);

        const extrudeSettings = {
            depth: 0.6,
            bevelEnabled: true,
            bevelSegments: 8,
            steps: 2,
            bevelSize: 0.15,
            bevelThickness: 0.15
        };

        const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        geometry.center();

        const material = new THREE.MeshPhongMaterial({
            color: 0xcc0033,
            emissive: 0x440011,
            specular: 0xff6699,
            shininess: 100,
            side: THREE.DoubleSide
        });

        const heart = new THREE.Mesh(geometry, material);
        const baseScale = window.innerWidth < 768 ? 1.35 : 2;
        heart.scale.set(baseScale, baseScale, baseScale);
        heart.rotation.z = Math.PI;
        heart.position.set(0, 0.5, 0);
        return heart;
    }

    const heart = createHeart();
    scene.add(heart);

    // ========================
    // PARTICLES AROUND HEART
    // ========================
    function createParticles() {
        const count = 250;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 2.5 + Math.random() * 5;
            positions[i * 3] = Math.cos(angle) * radius;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 7;
            positions[i * 3 + 2] = Math.sin(angle) * radius * 0.4;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ color: 0xff4477, size: 0.04, transparent: true, opacity: 0.6 });
        return new THREE.Points(geometry, material);
    }
    const particles = createParticles();
    scene.add(particles);

    // ========================
    // SEQUENTIAL MESSAGES (Russian only)
    // ========================
    const messages = [
        "Ты делаешь мои недели интереснее 🌟",
        "И намного приятнее 😊",
        "Обожаю твое чувство эстетики 🎨✨",
        "У тебя офигенный вкус во всём 👗💫",
        "А еще у тебя очень классная попа 🍑",
        "Очень сладкая и приятная 😁🍬",
        "И пахнешь ты невероятно 🌸💐",
        "С тобой можно очень клево потусить 🎉🥂",
        "Или проходить игры на иксбоксе 🎮🕹️",
        "Без тебя я их никогда не прохожу до конца 😅🏆",
        "Рад, что ты законектилась с моими друзьями 🤝💛",
        "Ты делаешь самые обдуманные подарки 🎁💝",
        "Жду не дождусь наших путешествий ✈️🌍",
        "Надеюсь, у нас все будет складываться круто 🍀🤞",
        "Ты очень приятный и важный для меня человек 💖🥰",
        "Я тебя люблю ❤️"
    ];
    let currentMsgIndex = 0;

    function getNextMessage() {
        if (currentMsgIndex < messages.length) {
            return messages[currentMsgIndex++];
        }
        // After all shown, cycle from the last few heartfelt ones
        const lastFew = messages.slice(-4);
        return lastFew[Math.floor(Math.random() * lastFew.length)];
    }

    // ========================
    // INTERACTION STATE
    // ========================
    let heartIntensity = 0;
    let clickBurstScale = 0;
    const clock = new THREE.Clock();

    // ========================
    // CLICK/TAP HANDLER
    // ========================
    function handleTap(x, y) {
        // Hide hint on first tap
        const hint = document.getElementById('tap-hint');
        if (hint) hint.remove();

        heartIntensity = Math.min(heartIntensity + 0.06, 1);
        clickBurstScale = 0.35;

        const textEl = document.createElement('div');
        textEl.className = 'love-text';
        textEl.textContent = getNextMessage();

        // White → light pink based on intensity
        const pink = Math.floor(heartIntensity * 50);
        textEl.style.color = 'rgb(255,' + (235 - pink) + ',' + (240 - pink) + ')';

        // Clamp text position so it doesn't go off-screen
        const textWidth = 180;
        const px = Math.max(10, Math.min(x - 70, window.innerWidth - textWidth));
        textEl.style.left = px + 'px';
        textEl.style.top = (y - 20) + 'px';
        textEl.style.fontSize = (16 + Math.random() * 10 + heartIntensity * 6) + 'px';
        document.body.appendChild(textEl);
        setTimeout(() => textEl.remove(), 2860);
    }

    // Mouse clicks
    document.addEventListener('click', (e) => {
        handleTap(e.clientX, e.clientY);
    });

    // Touch support for iPhone
    document.addEventListener('touchstart', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            handleTap(touch.clientX, touch.clientY);
        }
    }, { passive: false });

    // Decay intensity slowly
    setInterval(() => {
        heartIntensity = Math.max(0, heartIntensity - 0.003);
    }, 100);

    // ========================
    // ANIMATION LOOP
    // ========================
    let heartPhase = 0;

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        const intensity = heartIntensity;

        // === HEART BEAT ===
        const beatSpeed = 0.025 + intensity * 0.08;
        heartPhase += beatSpeed;

        // Double-bump heartbeat waveform
        const bump1 = Math.pow(Math.max(0, Math.sin(heartPhase)), 8);
        const bump2 = Math.pow(Math.max(0, Math.sin(heartPhase * 1.06 + 0.8)), 12) * 0.5;
        const beatWave = bump1 + bump2;

        // Amplitude grows with intensity
        const beatAmplitude = 0.03 + intensity * 0.18;
        const heartbeat = 1 + beatWave * beatAmplitude;

        // Click burst
        const burst = 1 + clickBurstScale;
        clickBurstScale *= 0.88;

        const baseS = window.innerWidth < 768 ? 1.35 : 2;
        const s = baseS * heartbeat * burst;
        heart.scale.set(s, s, s);
        heart.rotation.y = Math.sin(t * 0.3) * 0.12;

        // Heart glow
        const baseGlow = 0.15 + intensity * 0.4;
        const pulseGlow = beatWave * (0.1 + intensity * 0.3);
        heart.material.emissive.setRGB(baseGlow + pulseGlow, 0, (baseGlow + pulseGlow) * 0.25);

        // === PARTICLES ===
        particles.rotation.y = t * 0.08;
        particles.material.opacity = 0.3 + 0.25 * Math.sin(t * 0.7) + intensity * 0.2;

        // === LIGHTS ===
        pointLight1.intensity = 1.5 + Math.sin(heartPhase) * 0.3 + intensity * 2.5;
        pointLight2.intensity = 1 + Math.cos(t * 1.2) * 0.2 + intensity * 1.5;
        pointLight3.intensity = 0.8 + intensity * 1.5;

        // Valentine text glow pulses
        const vText = document.getElementById('valentine-text');
        const glowSize = 10 + intensity * 25 + beatWave * 15;
        const glowOp = 0.3 + intensity * 0.4;
        vText.style.textShadow = '0 0 ' + glowSize + 'px rgba(255,100,140,' + glowOp + '), 0 0 ' + (glowSize * 2) + 'px rgba(255,50,100,' + (glowOp * 0.5) + ')';
        vText.style.opacity = 0.7 + intensity * 0.3;

        renderer.render(scene, camera);
    }

    animate();

    // ========================
    // RESIZE
    // ========================
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    </script>
</body>
</html>
